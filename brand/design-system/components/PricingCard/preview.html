<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>PricingCard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap"></head>
<body style="margin:0;background:var(--paper)">
<div class="kr-row" style="align-items:stretch">
  <div class="kr-price kr-price--light"><p class="kr-price__name">Starter</p><p class="kr-price__for">Для особистих брендів</p><s>1&nbsp;000 ₴/міс</s><div class="kr-price__value"><b>0 ₴</b><span class="kr-price__note">перший місяць</span></div><ul><li>AI-агент для ваших акаунтів</li><li>Контент українською</li><li>Планування публікацій</li></ul><a class="kr-btn kr-btn--primary" href="#">Отримати знижку</a></div>
  <div class="kr-price kr-price--featured"><p class="kr-price__name">Team</p><p class="kr-price__for">Для бізнесу</p><s>3&nbsp;000 ₴/міс</s><div class="kr-price__value"><b>1&nbsp;500 ₴</b><span class="kr-price__note">перший місяць</span></div><ul><li>Усе зі Starter</li><li>Керування через Telegram</li><li>Командний доступ</li></ul><a class="kr-btn kr-btn--butter" href="#">Отримати знижку</a></div>
</div>
</body>
</html>
