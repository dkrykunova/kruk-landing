<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>EmailField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap"></head>
<body style="margin:0;background:var(--paper)">
<div class="kr-stack">
  <form class="kr-field" onsubmit="return false"><label for="e1" style="position:absolute;left:-9999px">Ваш email</label><input id="e1" class="kr-input" type="email" placeholder="name@example.com"><button class="kr-btn kr-btn--primary">Записатися</button></form>
  <form class="kr-field" onsubmit="return false"><label for="e2" style="position:absolute;left:-9999px">Ваш email</label><input id="e2" class="kr-input" type="email" value="olena@gmial" aria-invalid="true"><button class="kr-btn kr-btn--primary">Записатися</button><p class="kr-error">Перевірте email — схоже, в ньому помилка</p></form>
</div>
</body>
</html>
